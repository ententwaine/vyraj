<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VYRAJ | Kill Details</title>
    <!-- Google Fonts for modern cyberpunk typography -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="noise-overlay"></div>

    <!-- Header Navigation -->
    <header class="cyber-header">
      <div class="logo-container">
        <a href="/">
          <img src="/logo.png" alt="Vyraj Logo" class="logo">
        </a>
        <div class="logo-text">
          <span class="alliance-name">VYRAJ</span>
          <span class="alliance-sub">SYNDICATE</span>
        </div>
      </div>
      
      <div class="nav-and-radio" style="display: flex; align-items: center; gap: 2rem;">
        <nav class="main-nav">
          <a href="/#codex" class="nav-link">CODEX</a>
          <a href="/#fleet" class="nav-link">FLEET</a>
          <a href="/#operations" class="nav-link">OPERATIONS</a>
          <a href="/killboard.html" class="nav-link active">KILLBOARD</a>
        </nav>

        <!-- Mini Radio Player -->
        <div id="cyber-radio" class="cyber-radio">
          <div class="radio-status-dot"></div>
          <div class="radio-info">
            <div class="radio-title">DR WILSON RADIO</div>
            <div class="radio-track">Gone - New Eden Top 40</div>
          </div>
          <div class="radio-controls">
            <button id="radio-play-btn" class="radio-btn">⏸</button>
            <div class="vol-container">
              <span style="font-size: 0.5rem; color: var(--color-text-muted)">VOL</span>
              <input type="range" id="radio-vol" min="0" max="100" value="50">
            </div>
          </div>
        </div>
      </div>

      <div class="header-meta">
        <span class="time-code">YC 127</span>
        <span class="est-date">EST. 2024</span>
      </div>
    </header>

    <main class="kill-main">
      <div class="container">
        <a href="/killboard.html" class="cyber-btn btn-secondary back-btn">
          <span class="btn-text">◀ BACK TO KILLBOARD</span>
        </a>

        <div id="kill-loading" class="cyber-loading">
          <div class="loading-spinner"></div>
          <p>DECRYPTING KILL DATA...</p>
        </div>

        <div id="kill-details-container" class="kill-details-grid hidden">
          <!-- Victim Section -->
          <div class="kill-card victim-card">
            <h2 class="cyber-heading-small">VICTIM</h2>
            <div class="cyber-line"></div>
            <div id="victim-info" class="pilot-info-card"></div>
          </div>

          <!-- Stats Section -->
          <div class="kill-card stats-card">
            <h2 class="cyber-heading-small">BATTLE DATA</h2>
            <div class="cyber-line"></div>
            <div id="stats-info" class="stats-info-card"></div>
          </div>

          <!-- Attackers Section -->
          <div class="kill-card attackers-card">
            <h2 class="cyber-heading-small">ATTACKERS (<span id="attacker-count">0</span>)</h2>
            <div class="cyber-line"></div>
            <div id="attackers-list" class="attackers-list"></div>
          </div>
        </div>
      <!-- Hidden SoundCloud Iframe for API control -->
      <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2320677710&color=%23ff0000&auto_play=true&hide_related=false&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false" style="position:absolute; visibility:hidden; width:1px; height:1px;"></iframe>
    </main>

    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script type="module" src="/src/kill.js"></script>
    <script type="module" src="/src/radio.js"></script>
  </body>
</html>
